<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">The 7 Rs of Cloud Migration</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#475569">Seven ways to decide what happens to each application when a company moves to the cloud</text>

  <!-- Card template: x, color -->
  <!-- 1 Retire -->
  <g transform="translate(22,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#6B7280"/><rect y="50" width="155" height="20" fill="#6B7280"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#F1F5F9">1</text>
    <text x="77" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">RETIRE</text>
    <circle cx="77" cy="125" r="34" fill="#F3F4F6"/>
    <line x1="58" y1="106" x2="96" y2="144" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>
    <line x1="96" y1="106" x2="58" y2="144" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Switch it off</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Turn off apps that</tspan><tspan x="77" dy="18">nobody uses any more</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Throw away the</tspan><tspan x="77" dy="18">broken old sofa</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: none</text>
  </g>
  <!-- 2 Retain -->
  <g transform="translate(189,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#B45309"/><rect y="50" width="155" height="20" fill="#B45309"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#FEF3C7">2</text>
    <text x="77" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">RETAIN</text>
    <circle cx="77" cy="125" r="34" fill="#FEF3C7"/>
    <rect x="62" y="118" width="30" height="24" rx="3" fill="#B45309"/>
    <path d="M67 118 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#B45309" stroke-width="5"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Keep it here</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Leave it on-premises</tspan><tspan x="77" dy="18">for now; revisit later</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">The heavy piano stays</tspan><tspan x="77" dy="18">in the old house</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: none</text>
  </g>
  <!-- 3 Relocate -->
  <g transform="translate(356,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#0E7490"/><rect y="50" width="155" height="20" fill="#0E7490"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#CFFAFE">3</text>
    <text x="77" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">RELOCATE</text>
    <circle cx="77" cy="125" r="34" fill="#CFFAFE"/>
    <rect x="52" y="112" width="34" height="24" fill="#0E7490"/><path d="M86 118 h12 l6 8 v10 h-18z" fill="#0E7490"/>
    <circle cx="62" cy="139" r="4" fill="#164E63"/><circle cx="94" cy="139" r="4" fill="#164E63"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Move the platform</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">VMware on-prem to</tspan><tspan x="77" dy="18">VMware in the cloud</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#0E7490">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Ship the whole furnished</tspan><tspan x="77" dy="18">room in one container</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: very low</text>
  </g>
  <!-- 4 Rehost -->
  <g transform="translate(523,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#1D4ED8"/><rect y="50" width="155" height="20" fill="#1D4ED8"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#DBEAFE">4</text>
    <text x="77" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">REHOST</text>
    <circle cx="77" cy="125" r="34" fill="#DBEAFE"/>
    <rect x="62" y="120" width="30" height="22" rx="3" fill="#1D4ED8"/>
    <path d="M77 98 l-11 12 h7 v8 h8 v-8 h7z" fill="#1D4ED8"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Lift and shift</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Same server, copied</tspan><tspan x="77" dy="18">to a cloud machine</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Carry the sofa to the</tspan><tspan x="77" dy="18">new house exactly as is</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: low</text>
  </g>
  <!-- 5 Repurchase -->
  <g transform="translate(690,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#6D28D9"/><rect y="50" width="155" height="20" fill="#6D28D9"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#EDE9FE">5</text>
    <text x="77" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">REPURCHASE</text>
    <circle cx="77" cy="125" r="34" fill="#EDE9FE"/>
    <path d="M58 110 h8 l6 22 h20 l5 -16 h-28" fill="none" stroke="#6D28D9" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="74" cy="141" r="4" fill="#6D28D9"/><circle cx="90" cy="141" r="4" fill="#6D28D9"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Buy ready-made</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Replace your own app</tspan><tspan x="77" dy="18">with a SaaS product</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Sell the old TV, buy</tspan><tspan x="77" dy="18">a new smart TV there</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: replace</text>
  </g>
  <!-- 6 Replatform -->
  <g transform="translate(857,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#047857"/><rect y="50" width="155" height="20" fill="#047857"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#D1FAE5">6</text>
    <text x="77" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">REPLATFORM</text>
    <circle cx="77" cy="125" r="34" fill="#D1FAE5"/>
    <circle cx="77" cy="125" r="12" fill="none" stroke="#047857" stroke-width="6"/>
    <g stroke="#047857" stroke-width="6" stroke-linecap="round"><line x1="77" y1="101" x2="77" y2="107"/><line x1="77" y1="143" x2="77" y2="149"/><line x1="53" y1="125" x2="59" y2="125"/><line x1="95" y1="125" x2="101" y2="125"/></g>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Lift, tweak, shift</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Small changes to use</tspan><tspan x="77" dy="18">managed cloud services</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Same sofa, but new</tspan><tspan x="77" dy="18">cushions and legs</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: medium</text>
  </g>
  <!-- 7 Refactor -->
  <g transform="translate(1024,105)">
    <rect width="155" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="155" height="70" rx="12" fill="#B91C1C"/><rect y="50" width="155" height="20" fill="#B91C1C"/>
    <text x="77" y="30" text-anchor="middle" font-size="13" fill="#FEE2E2">7</text>
    <text x="77" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">REFACTOR</text>
    <circle cx="77" cy="125" r="34" fill="#FEE2E2"/>
    <rect x="57" y="105" width="17" height="17" rx="3" fill="#B91C1C"/><rect x="80" y="105" width="17" height="17" rx="3" fill="#B91C1C"/>
    <rect x="57" y="128" width="17" height="17" rx="3" fill="#B91C1C"/><rect x="80" y="128" width="17" height="17" rx="3" fill="#F87171"/>
    <text x="77" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Rebuild for cloud</text>
    <text x="77" y="225" text-anchor="middle" font-size="13" fill="#334155"><tspan x="77">Redesign the app to be</tspan><tspan x="77" dy="18">truly cloud-native</tspan></text>
    <line x1="15" y1="275" x2="140" y2="275" stroke="#E2E8F0"/>
    <text x="77" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">HOUSE-MOVE IDEA</text>
    <text x="77" y="325" text-anchor="middle" font-size="13" fill="#334155" font-style="italic"><tspan x="77">Custom modular furniture</tspan><tspan x="77" dy="18">built for the new home</tspan></text>
    <text x="77" y="385" text-anchor="middle" font-size="12" fill="#64748B">Change: high</text>
  </g>

  <!-- Bottom arrow -->
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#94A3B8"/><stop offset="1" stop-color="#B91C1C"/></linearGradient>
  </defs>
  <rect x="40" y="535" width="1100" height="12" rx="6" fill="url(#g)"/>
  <path d="M1140 527 l28 14 l-28 14z" fill="#B91C1C"/>
  <text x="40" y="575" font-size="14" fill="#475569">Less effort, less change, faster</text>
  <text x="1160" y="575" text-anchor="end" font-size="14" fill="#475569">More effort, more change, more cloud benefit</text>
</svg>
