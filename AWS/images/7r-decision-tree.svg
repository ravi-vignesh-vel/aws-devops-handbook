<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748B"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Which R should I pick? A simple decision path</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#475569">Ask these questions for each application, one at a time, top to bottom</text>

  <g font-size="14" fill="#0F172A">
    <!-- Questions column -->
    <g>
      <rect x="40" y="100" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="128" text-anchor="middle" font-weight="700">Q1. Is anyone still using this app?</text>
      <text x="320" y="150" text-anchor="middle" fill="#475569">Does it still deliver business value?</text>
    </g>
    <g>
      <rect x="40" y="200" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="228" text-anchor="middle" font-weight="700">Q2. Can it move to the cloud right now?</text>
      <text x="320" y="250" text-anchor="middle" fill="#475569">No blockers: laws, special hardware, being retired soon</text>
    </g>
    <g>
      <rect x="40" y="300" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="328" text-anchor="middle" font-weight="700">Q3. Is there a good ready-made (SaaS) product?</text>
      <text x="320" y="350" text-anchor="middle" fill="#475569">Is it a common need, like email, HR or CRM?</text>
    </g>
    <g>
      <rect x="40" y="400" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="428" text-anchor="middle" font-weight="700">Q4. Does it run on VMware, and must we move very fast?</text>
      <text x="320" y="450" text-anchor="middle" fill="#475569">Whole data-center exit with a hard deadline</text>
    </g>
    <g>
      <rect x="40" y="500" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="528" text-anchor="middle" font-weight="700">Q5. Does the app need to grow, scale or change a lot?</text>
      <text x="320" y="550" text-anchor="middle" fill="#475569">Is it a key business app that needs new features?</text>
    </g>
    <g>
      <rect x="40" y="600" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="320" y="628" text-anchor="middle" font-weight="700">Q6. Can a few small changes give quick savings?</text>
      <text x="320" y="650" text-anchor="middle" fill="#475569">For example: use a managed database instead of our own</text>
    </g>

    <!-- Down arrows (the "move on" path) -->
    <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="320" y1="164" x2="320" y2="198"/>
      <line x1="320" y1="264" x2="320" y2="298"/>
      <line x1="320" y1="364" x2="320" y2="398"/>
      <line x1="320" y1="464" x2="320" y2="498"/>
      <line x1="320" y1="564" x2="320" y2="598"/>
      <line x1="320" y1="664" x2="320" y2="700"/>
    </g>
    <g font-size="12" fill="#475569" font-weight="700">
      <text x="330" y="186">YES</text>
      <text x="330" y="286">YES</text>
      <text x="330" y="386">NO</text>
      <text x="330" y="486">NO</text>
      <text x="330" y="586">NO</text>
      <text x="330" y="688">NO</text>
    </g>

    <!-- Side arrows to outcomes -->
    <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="600" y1="132" x2="788" y2="132"/>
      <line x1="600" y1="232" x2="788" y2="232"/>
      <line x1="600" y1="332" x2="788" y2="332"/>
      <line x1="600" y1="432" x2="788" y2="432"/>
      <line x1="600" y1="532" x2="788" y2="532"/>
      <line x1="600" y1="632" x2="788" y2="632"/>
    </g>
    <g font-size="12" fill="#475569" font-weight="700">
      <text x="680" y="124">NO</text>
      <text x="680" y="224">NO</text>
      <text x="680" y="324">YES</text>
      <text x="680" y="424">YES</text>
      <text x="680" y="524">YES</text>
      <text x="680" y="624">YES</text>
    </g>

    <!-- Outcomes -->
    <g font-weight="700" fill="#FFFFFF" font-size="17">
      <rect x="790" y="104" width="370" height="56" rx="10" fill="#6B7280"/>
      <text x="975" y="138" text-anchor="middle">RETIRE  (switch it off)</text>
      <rect x="790" y="204" width="370" height="56" rx="10" fill="#B45309"/>
      <text x="975" y="238" text-anchor="middle">RETAIN  (keep it for now)</text>
      <rect x="790" y="304" width="370" height="56" rx="10" fill="#6D28D9"/>
      <text x="975" y="338" text-anchor="middle">REPURCHASE  (buy SaaS)</text>
      <rect x="790" y="404" width="370" height="56" rx="10" fill="#0E7490"/>
      <text x="975" y="438" text-anchor="middle">RELOCATE  (move VMware as is)</text>
      <rect x="790" y="504" width="370" height="56" rx="10" fill="#B91C1C"/>
      <text x="975" y="538" text-anchor="middle">REFACTOR  (re-architect)</text>
      <rect x="790" y="604" width="370" height="56" rx="10" fill="#047857"/>
      <text x="975" y="638" text-anchor="middle">REPLATFORM  (lift, tweak, shift)</text>
    </g>
    <rect x="170" y="702" width="300" height="48" rx="10" fill="#1D4ED8"/>
    <text x="320" y="732" text-anchor="middle" font-weight="700" fill="#FFFFFF" font-size="17">REHOST  (lift and shift)</text>
  </g>
</svg>
