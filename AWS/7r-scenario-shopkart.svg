<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Scenario: ShopKart moves its 12 applications to the cloud</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#475569">A fictional online retailer closes its own data center. Every app gets exactly one R.</text>

  <!-- Left: old data center -->
  <rect x="30" y="100" width="300" height="510" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="180" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">ShopKart data center (today)</text>
  <g font-size="13" fill="#0F172A">
    <rect x="50" y="150" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="170">Old 2015 reporting tool</text>
    <rect x="50" y="186" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="206">Mainframe billing system</text>
    <rect x="50" y="222" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="242">Warehouse scanner app</text>
    <rect x="50" y="258" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="278">300 VMware virtual machines</text>
    <rect x="50" y="294" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="314">Internal HR portal (Windows)</text>
    <rect x="50" y="330" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="350">File and print servers</text>
    <rect x="50" y="366" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="386">Self-hosted email (Exchange)</text>
    <rect x="50" y="402" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="422">Home-made CRM</text>
    <rect x="50" y="438" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="458">Product catalogue + MySQL</text>
    <rect x="50" y="474" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="494">Order-tracking app on Tomcat</text>
    <rect x="50" y="510" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="530">Main shopping website</text>
    <rect x="50" y="546" width="260" height="30" rx="6" fill="#F1F5F9"/><text x="62" y="566">Festival-sale checkout</text>
  </g>

  <path d="M345 355 h70" stroke="#64748B" stroke-width="4" fill="none"/>
  <path d="M415 343 l22 12 l-22 12z" fill="#64748B"/>
  <text x="390" y="335" text-anchor="middle" font-size="12" fill="#475569" font-weight="700">ASSESS</text>

  <!-- Right: buckets -->
  <g font-size="13">
    <g transform="translate(455,100)">
      <rect width="350" height="96" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
      <rect width="110" height="96" rx="10" fill="#6B7280"/><text x="55" y="54" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">RETIRE</text>
      <text x="125" y="40" fill="#0F172A">Old 2015 reporting tool</text>
      <text x="125" y="68" fill="#64748B" font-size="12">Only 2 users in a year; data archived</text>
    </g>
    <g transform="translate(455,206)">
      <rect width="350" height="96" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
      <rect width="110" height="96" rx="10" fill="#B45309"/><text x="55" y="54" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">RETAIN</text>
      <text x="125" y="36" fill="#0F172A">Mainframe billing system</text>
      <text x="125" y="58" fill="#0F172A">Warehouse scanner app</text>
      <text x="125" y="82" fill="#64748B" font-size="12">Too risky now / needs local hardware</text>
    </g>
    <g transform="translate(455,312)">
      <rect width="350" height="96" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
      <rect width="110" height="96" rx="10" fill="#0E7490"/><text x="55" y="54" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">RELOCATE</text>
      <text x="125" y="40" fill="#0F172A">300 VMware virtual machines</text>
      <text x="125" y="68" fill="#64748B" font-size="12">Same VMware, now in the cloud</text>
    </g>
    <g transform="translate(455,418)">
      <rect width="350" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
      <rect width="110" height="96" rx="10" fill="#1D4ED8"/><text x="55" y="54" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">REHOST</text>
      <text x="125" y="36" fill="#0F172A">Internal HR portal (Windows)</text>
      <text x="125" y="58" fill="#0F172A">File and print servers</text>
      <text x="125" y="82" fill="#64748B" font-size="12">Copied as-is to cloud VMs</text>
    </g>
    <g transform="translate(830,100)">
      <rect width="340" height="130" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
      <rect width="120" height="130" rx="10" fill="#6D28D9"/><text x="60" y="71" text-anchor="middle" fill="#FFF" font-weight="700" font-size="15">REPURCHASE</text>
      <text x="134" y="44" fill="#0F172A">Email → Microsoft 365</text>
      <text x="134" y="70" fill="#0F172A">Home-made CRM → Salesforce</text>
      <text x="134" y="104" fill="#64748B" font-size="12">Buy instead of maintain</text>
    </g>
    <g transform="translate(830,244)">
      <rect width="340" height="130" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
      <rect width="120" height="130" rx="10" fill="#047857"/><text x="60" y="71" text-anchor="middle" fill="#FFF" font-weight="700" font-size="15">REPLATFORM</text>
      <text x="134" y="44" fill="#0F172A">Catalogue → managed MySQL</text>
      <text x="134" y="70" fill="#0F172A">Order app → containers</text>
      <text x="134" y="104" fill="#64748B" font-size="12">Same code, smarter home</text>
    </g>
    <g transform="translate(830,388)">
      <rect width="340" height="130" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
      <rect width="120" height="130" rx="10" fill="#B91C1C"/><text x="60" y="71" text-anchor="middle" fill="#FFF" font-weight="700" font-size="15">REFACTOR</text>
      <text x="134" y="44" fill="#0F172A">Shopping website</text>
      <text x="134" y="70" fill="#0F172A">Festival-sale checkout</text>
      <text x="134" y="104" fill="#64748B" font-size="12">Microservices + serverless</text>
    </g>
  </g>

  <rect x="455" y="540" width="715" height="70" rx="10" fill="#0F172A"/>
  <text x="812" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Result: 1 retired, 2 kept, 9 moved in 5 different ways</text>
  <text x="812" y="594" text-anchor="middle" font-size="13" fill="#CBD5E1">One company, one migration, many strategies. That is the whole idea of the 7 Rs.</text>
</svg>
